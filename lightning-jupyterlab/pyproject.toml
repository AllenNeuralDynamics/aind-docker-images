# Direct dependencies of the image's /opt/conda environment, as lower
# bounds that Dependabot raises; uv.lock pins the full tree and is what the
# Dockerfile installs.
[project]
name = "lightning-jupyterlab"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "jupyterlab>=4.6.4",
    "notebook>=7.6.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "lightning>=2.6.6",
    "tensorboard>=2.21.0",
]

[tool.uv]
package = false
# Lock only for the platform the image runs on.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
