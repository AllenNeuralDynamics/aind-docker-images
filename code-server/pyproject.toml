# Direct dependencies of the image's /opt/conda environment, as lower
# bounds that Dependabot raises; uv.lock pins the full tree and is what the
# Dockerfile installs.
[project]
name = "code-server"
version = "0"
requires-python = "==3.13.*"
dependencies = [
    "codeocean-mcp-server>=0.13.1",
    "ipykernel>=7.4.0",
]

[tool.uv]
package = false
# Lock only for the platform the image runs on.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
