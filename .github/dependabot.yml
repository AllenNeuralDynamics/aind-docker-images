version: 2

# Docker updates get one entry per set of owners in .github/CODEOWNERS, so each
# grouped PR goes to the people who can approve all of it.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/cuda12-base-uv"
      - "/cuda12-runtime-uv"
      - "/python-slim-uv"
      - "/ubuntu-ffmpeg"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-base:
        patterns:
          - "*"
    ignore:
      # Image names encode the CUDA major, so a new major is a new image.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/cuda11-miniconda-jupyterlab"
      - "/cuda12-miniconda-jupyterlab"
      - "/cuda13-miniforge-jupyterlab"
      - "/lightning-jupyterlab"
      - "/lightning-jupyterlab-py39"
      - "/pytorch-tensorflow-jax"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-jupyterlab:
        patterns:
          - "*"
    ignore:
      # Image names encode the CUDA major, so a new major is a new image.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directories:
      - "/pytorch-py310"
      - "/r2u-rstudio"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-pytorch-r:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/aind-airflow"
      - "/hortacloud-deployment"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docker-deployment:
        patterns:
          - "*"
    ignore:
      # Airflow 3 is a migration, not a bump; tracked in #73.
      - dependency-name: "apache/airflow"
        update-types: ["version-update:semver-major"]
      # Odd Node majors never become LTS; move to the next even major by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
