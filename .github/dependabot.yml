version: 2

# Docker updates get one entry per set of owners in .github/CODEOWNERS, so each
# grouped PR goes to the people who can approve all of it.
#
# Every entry runs monthly. Rebasing is off because a rebase looks up digests
# again and replaces the PR whenever main moves; comment `@dependabot rebase`
# on a PR that conflicts.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/cuda13-base-uv"
      - "/python-slim-uv"
      - "/ubuntu-ffmpeg"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker-base:
        patterns:
          - "*"
    ignore:
      # Image names encode the CUDA major, so a new major is a new image.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]
      # New Python minors lag in wheels; move python-slim-uv by hand.
      - dependency-name: "docker/library/python"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: "docker"
    directories:
      - "/cuda13-miniforge-jupyterlab"
      - "/jax-jupyterlab"
      - "/lightning-jupyterlab"
      - "/tensorflow-jupyterlab"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker-jupyterlab:
        patterns:
          - "*"
    ignore:
      # Image names encode the CUDA major, so a new major is a new image.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "uv"
    directories:
      - "/cuda13-miniforge-jupyterlab"
      - "/jax-jupyterlab"
      - "/lightning-jupyterlab"
      - "/tensorflow-jupyterlab"
    # Raise pyproject.toml's lower bound with each update and relock.
    versioning-strategy: "increase"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      # Majors fall outside the group and arrive as separate PRs.
      uv-jupyterlab:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/pytorch-py311-cuda13"
      - "/r2u-rstudio"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker-pytorch-r:
        patterns:
          - "*"
    ignore:
      # A new CUDA major raises the host driver floor; move it by hand.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/pytorch-py311-cuda13"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      pip-pytorch:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/aind-airflow"
      - "/hortacloud-deployment"
    rebase-strategy: "disabled"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      docker-deployment:
        patterns:
          - "*"
    ignore:
      # Airflow 3 is a migration, not a bump; tracked in #73.
      - dependency-name: "apache/airflow"
        update-types: ["version-update:semver-major"]
      # Odd Node majors never become LTS; move to the next even major by hand.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
